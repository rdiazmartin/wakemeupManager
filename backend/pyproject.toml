[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wakemeup-backend"
version = "0.1.0"
description = "Backend de wakemeupManager: gestión de encendido/apagado de máquinas de la red"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.34",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.22",
    # ipaddress: stdlib (redes del descubrimiento; sin dependencia extra)
    "asyncssh>=2.24.0",
    "mcp==2.2.0",
]

[project.scripts]
wakemeup-cli = "wakemeup.cli:main"
wakemeup-install = "wakemeup.install:main"
wakemeup-server = "wakemeup.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wakemeup"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
